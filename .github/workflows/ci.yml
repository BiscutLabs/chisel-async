name: Library qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        # macOS qualification is explicitly deferred; it is not a passing/skipped lane.
        include:
          - os: ubuntu-24.04
            python: '3.12.13'
          - os: windows-2025
            # setup-python has no Windows binaries for security-only 3.12 releases.
            python: '3.12.10'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact pinned JDK
        run: python tools/bootstrap_jdk.py
      - name: Install native Windows event simulator
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-iverilog
      - name: Expose native Windows simulator
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value '${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin'
      - name: Linux event-simulator build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf gperf bison flex g++ make
      - name: Build pinned Icarus on Linux
        if: runner.os == 'Linux'
        run: python tools/build_iverilog.py
      - name: Install verification dependencies
        run: python -m pip install --require-hashes -r verification/requirements.txt
      - name: Install pinned native compiler
        run: python tools/bootstrap.py
      - name: Compile, test and emit examples
        run: python tools/sbt.py --bootstrap test "examples/runMain chiselasync.examples.EmitFixtures target/generated" "examples/runMain chiselasync.examples.EmitControllerComparison target/generated/comparison_unsafe" "examples/runMain chiselasync.examples.EmitLongHold target/generated"
      - name: Verify exported models
        run: python tools/check_export.py
      - name: Verify reference contracts and runner failure controls
        run: python -m pytest verification/test_runner.py verification/test_reference.py verification/test_timing_reference.py verification/test_timing_runner.py verification/test_export.py verification/test_controller_comparison.py verification/test_longhold.py -q
      - name: Run independent event tests and known-bad control
        run: python verification/run.py
      - name: Reproduce withdrawn controller counterexample
        run: python verification/controller_race.py
      - name: Compare published reference under bounded internal delays
        run: python verification/compare_controllers.py
      - name: Run timing boundaries and primitive fault controls
        run: python verification/run_timing.py
      - name: Verify published long-hold controller, primitive tables and typed payloads
        run: python verification/run_longhold.py
      - name: Consume published artifact outside source project
        run: python tools/consumer_smoke.py
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.os }}
          path: |
            target/test-reports
            target/verification
            target/generated/**/contract.json
            target/generated/**/resolved.json
            target/generated/**/design.hw.mlir
            target/generated/**/contract_*.log
            target/consumers/**/verification
          if-no-files-found: error
