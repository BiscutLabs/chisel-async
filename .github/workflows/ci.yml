name: Library qualification
on:
  workflow_call:
    inputs:
      release_artifact:
        type: string
        default: ''
      source_ref:
        type: string
        default: ''
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      l0:
        description: Run the frozen L0 candidate (includes full qualification)
        type: boolean
        default: false
      l1:
        description: Run frozen L1 acceptance after complete qualification
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        # macOS qualification is explicitly deferred; it is not a passing/skipped lane.
        include:
          - os: ubuntu-24.04
            python: '3.12.13'
          - os: windows-2025
            # setup-python has no Windows binaries for security-only 3.12 releases.
            python: '3.12.10'
    runs-on: ${{ matrix.os }}
    # The full cold Windows run took 44 minutes including evidence upload.
    # Leave host-speed margin; test counts and per-case/step deadlines are unchanged.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native Windows simulation prerequisites
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-iverilog mingw-w64-ucrt-x86_64-gcc make
      - name: Install checksum-pinned native Verilator
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-verilator-5.046-1-any.pkg.tar.zst -o .tools/verilator-5.046.pkg.tar.zst
          echo '8c11e6057890d67157bf4285211381a2474c0b2172bc10254657d018f9449a2a  .tools/verilator-5.046.pkg.tar.zst' | sha256sum --check -
          pacman --noconfirm -U .tools/verilator-5.046.pkg.tar.zst
      - name: Expose native Windows simulator
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value '${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin'
      - name: Linux event-simulator build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf gperf bison flex libfl-dev g++ make
      - name: Set up and run complete qualification
        if: inputs.l0 != true
        run: python tools/qualify.py
      - name: Check active documentation
        run: python tools/check_docs.py
      - name: Download the single Linux-built release distribution
        if: inputs.release_artifact != '' && inputs.release_artifact != null
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.release_artifact }}
          path: target/release-candidate
      - name: Consume and simulate the exact release JAR
        if: inputs.release_artifact != '' && inputs.release_artifact != null
        run: >-
          python -c "import os, subprocess;
          subprocess.run(['.venv/Scripts/python.exe' if os.name == 'nt' else '.venv/bin/python',
          'tools/check_quickstart.py', '--distribution', 'target/release-candidate',
          '--qualification-report', 'target/verification/qualification/report.json',
          '--evidence', 'target/release-consumer'], check=True)"
      - name: Retain release consumer binding
        if: inputs.release_artifact != '' && inputs.release_artifact != null
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-consumer-${{ runner.os }}
          path: target/release-consumer
          if-no-files-found: error
      - name: Run frozen L0 acceptance
        if: inputs.l0 == true
        run: python verification/run_l0.py
      - name: Run frozen L1 acceptance
        if: inputs.l1 == true && inputs.l0 != true
        run: >-
          python -c "import os, subprocess;
          subprocess.run(['.venv/Scripts/python.exe' if os.name == 'nt' else '.venv/bin/python',
          'verification/l1_acceptance.py', '--plan', 'verification/l1-plan-2.json',
          '--candidate', 'qualification/l1-candidate-2.json',
          '--output', 'target/verification/l1/ci-${{ github.run_id }}-${{ github.run_attempt }}'], check=True)"
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.os }}
          path: |
            target/test-reports
            verification/chiselsim/target/test-reports
            build/chiselsim/**/simulation-log.txt
            build/chiselsim/**/execution-script.txt
            build/chiselsim/**/compilation-log.txt
            build/consumer/**/simulation-log.txt
            build/consumer/**/execution-script.txt
            build/consumer/**/compilation-log.txt
            build/quickstart/**/simulation-log.txt
            build/quickstart/**/execution-script.txt
            build/quickstart/**/compilation-log.txt
            target/verification
            target/generated/**/contract.json
            target/generated/**/resolved.json
            target/generated/**/design.hw.mlir
            target/generated/**/*.sv
            target/generated/**/filelist.f
            target/generated/**/ports.json
            target/generated/**/contract_*.log
            target/consumers/**/verification
            target/consumers/**/generated/**/contract.json
            target/consumers/**/generated/**/ports.json
            target/consumers/**/generated/**/resolved.json
            target/consumers/**/generated/**/*.sv
            target/consumers/**/generated/**/filelist.f
            target/consumers/**/generated/**/design.hw.mlir
            target/consumers/**/target/test-reports
          if-no-files-found: error
